<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Crash Course</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div>
      <h1>Hello World</h1>
      <p id="name">Manny Johnson</p>
      <p class="cool">Hello Everyone</p>
      <p>I am inside the div</p>
      <h4>Just coding</h4>
    </div>
    <p>I am outside the div</p>
    <span>I</span> <br />
    <span>am</span> <br />
    <span>into</span> <br />
    <span>programming</span> <br />
    <a href="www.google.com">Google</a>
    <a href="wwws.instagram.com">Instagram</a>
    <a href="wwws.threads.com">Threads</a>
    <div id="parent">
      <div id="child"></div>
    </div>

    <p id="box">Hello World</p>

    <div id="display">Hi, guys.</div>
    <span id="display_low"> Hi, again guys. </span>
    <div id="out"><div id="in"></div></div>

    <div id="flex-box">
      <div id="one">Flex-1</div>
      <div id="two">Flex-2</div>
      <div id="three">Flex-3</div>
    </div>

    <div id="grid-box">
      <div id="grid-one"></div>
      <div id="grid-two"></div>
      <div id="grid-three"></div>
      <div id="grid-four"></div>
      <div id="grid-five"></div>
    </div>
  </body>
</html>
