<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Crash Course</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div>
      <h1>Hello World</h1>
      <p id="name" class="style">Manny Johnson</p>
      <p class="cool" class="style">Hello Everyone</p>
      <p class="style">I am inside the div</p>
      <h4>Just coding</h4>
    </div>
    <p class="style">I am outside the div</p>
    <span>I</span> <br />
    <span>am</span> <br />
    <span>into</span> <br />
    <span>programming</span> <br />
    <a href="www.google.com">Google</a>
    <a href="wwws.instagram.com">Instagram</a>
    <a href="wwws.threads.com">Threads</a>
    <div id="parent">
      <div id="child"></div>
    </div>

    <p id="box" class="style">Hello World</p>

    <div id="display">Hi, guys.</div>
    <span id="display_low"> Hi, again guys. </span>
    <div id="out"><div id="in"></div></div>
    <!-- FLEXBOX -->
    <div id="flex-box">
      <div id="one">Flex-1</div>
      <div id="two">Flex-2</div>
      <div id="three">Flex-3</div>
    </div>

    <!-- GRID -->
    <div id="grid-box">
      <div id="grid-one"></div>
      <div id="grid-two"></div>
      <div id="grid-three"></div>
      <div id="grid-four"></div>
      <div id="grid-five"></div>
    </div>

    <!-- Pseudo Classes -->
    <button id="pseudo-btn">Click Me</button>

    <input type="text" />

    <a href="www.google.com" id="p-test">Visit Google</a>
    <input type="checkbox" name="" id="" />

    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
      <li>Item 4</li>
    </ul>

    <!-- Pseudo Elements -->
    <p id="greet">Hello</p>

    <div id="shadow-out">
      <div id="shadow-in"></div>
    </div>
    <!-- Media Queries -->
    <div id="media"></div>

    <!-- Transform -->

    <div id="transform"></div>

    <button id="transition-btn">Transition</button>

    <!-- Animation -->
    <div id="animate"></div>
  </body>
</html>
